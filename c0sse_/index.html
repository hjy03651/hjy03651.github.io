    .link-card {

  <script>
    (() => {
      const canvas = document.querySelector('.arrow-pattern');
      const context = canvas.getContext('2d');
      const arrow = new Image();
      let resizeFrame = 0;

      arrow.src = './arrow.png';

      function drawPattern() {
        if (!arrow.naturalWidth) return;

        const styles = getComputedStyle(document.documentElement);
        const background = styles.getPropertyValue('--pattern-bg').trim();
        const arrowColor = styles.getPropertyValue('--pattern-arrow').trim();
        const size = parseFloat(styles.getPropertyValue('--pattern-size'));
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        const width = window.innerWidth;
        const height = window.innerHeight;

        /*
          arrow(1).png 원본(500×500)의 경계 좌표로 만든 비스듬한 격자입니다.

          진행 방향 이동: (406.5, 400)
            현재 화살표 아랫부분의 사선 [(500,300)–(313,500)] 중점
            → 다음 화살표의 왼쪽 위 꼭짓점

          왼쪽 아래 이동: (-467, 441)
            현재 화살표의 왼쪽 아래 꼭짓점 → 다음 화살표의 오른쪽 위 꼭짓점

          이 두 이동을 계속 조합하면 참고 그림의 위·왼쪽·오른쪽·아래
          네 화살표 배치가 끊기지 않고 화면 전체로 반복됩니다.
        */
        const lowerEdgeMidpointX = (500 + 313) / 2;
        const lowerEdgeMidpointY = (300 + 500) / 2;
        const rightVector = [
          size * (lowerEdgeMidpointX / 500),
          size * (lowerEdgeMidpointY / 500)
        ];
        const leftVector = [-size * (467 / 500), size * (441 / 500)];
        const determinant =
          rightVector[0] * leftVector[1] -
          leftVector[0] * rightVector[1];

        const corners = [
          [-size, -size],
          [width + size, -size],
          [-size, height + size],
          [width + size, height + size]
        ];

        const latticeCoordinates = corners.map(([x, y]) => [
          (x * leftVector[1] - leftVector[0] * y) / determinant,
          (rightVector[0] * y - x * rightVector[1]) / determinant
        ]);

        const iMin = Math.floor(
          Math.min(...latticeCoordinates.map(([i]) => i))
        ) - 2;
        const iMax = Math.ceil(
          Math.max(...latticeCoordinates.map(([i]) => i))
        ) + 2;
        const jMin = Math.floor(
          Math.min(...latticeCoordinates.map(([, j]) => j))
        ) - 2;
        const jMax = Math.ceil(
          Math.max(...latticeCoordinates.map(([, j]) => j))
        ) + 2;

        canvas.width = Math.ceil(width * pixelRatio);
        canvas.height = Math.ceil(height * pixelRatio);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;

        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        context.clearRect(0, 0, width, height);
        context.fillStyle = background;
        context.fillRect(0, 0, width, height);
        context.imageSmoothingEnabled = true;

        const coloredArrow = document.createElement('canvas');
        const coloredContext = coloredArrow.getContext('2d');
        coloredArrow.width = arrow.naturalWidth;
        coloredArrow.height = arrow.naturalHeight;
        coloredContext.drawImage(arrow, 0, 0);
        coloredContext.globalCompositeOperation = 'source-in';
        coloredContext.fillStyle = arrowColor;
        coloredContext.fillRect(0, 0, coloredArrow.width, coloredArrow.height);

        for (let i = iMin; i <= iMax; i += 1) {
          for (let j = jMin; j <= jMax; j += 1) {
            const x =
              i * rightVector[0] + j * leftVector[0];
            const y =
              i * rightVector[1] + j * leftVector[1];
            context.drawImage(coloredArrow, x, y, size, size);
          }
        }

        canvas.classList.add('is-ready');
      }

      arrow.addEventListener('load', drawPattern);

      if (arrow.complete && arrow.naturalWidth) {
        drawPattern();
      }

      window.addEventListener('resize', () => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(drawPattern);
      });
    })();
  </script>
